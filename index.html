<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دليلك الطبي - تحديد الموقع</title>
    <!-- استدعاء مكتبة خرائط Leaflet المجانية -->
    <link rel="stylesheet" href="https://unpkg.com" />
    <style>
        body { font-family: Tahoma, Arial, sans-serif; text-align: center; margin: 0; padding: 20px; background-color: #f4f7f6; }
        h2 { color: #00796b; }
        button { background-color: #00796b; color: white; border: none; padding: 12px 24px; font-size: 16px; border-radius: 8px; cursor: pointer; margin-bottom: 15px; }
        button:hover { background-color: #004d40; }
        #status { margin: 10px 0; font-weight: bold; color: #333; }
        #map { height: 450px; width: 100%; max-width: 800px; margin: 0 auto; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

    <h2>🏥 دليلك الطبي - أقرب الخدمات إليك</h2>
    <button onclick="getUserLocation()">📍 تحديد موقعي الحالي</button>
    <div id="status">اضغط على الزر لتحديد موقعك وعرض الخريطة</div>
    <div id="map"></div>

    <!-- استدعاء كود الخرائط -->
    <script src="https://unpkg.com"></script>
    <script>
        // تهيئة الخريطة مبدئياً (مثال: الأقصر، مصر)
        let map = L.map('map').setView([25.6872, 32.6396], 13);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© OpenStreetMap'
        }).addTo(map);

        let userMarker;

        function getUserLocation() {
            const status = document.getElementById('status');

            if (!navigator.geolocation) {
                status.textContent = "متصفحك لا يدعم خاصية تحديد الموقع الجغرافي.";
                return;
            }

            status.textContent = "جاري تحديد موقعك...";

            navigator.geolocation.getCurrentPosition(
                (position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;

                    status.textContent = `تم تحديد موقعك بنجاح! (خط العرض: ${lat.toFixed(4)}، خط الطول: ${lng.toFixed(4)})`;

                    // تحريك الخريطة لموقع المستخدم
                    map.setView([lat, lng], 15);

                    // إضافة أو تحديث علامة موقع المستخدم
                    if (userMarker) {
                        userMarker.setLatLng([lat, lng]);
                    } else {
                        userMarker = L.marker([lat, lng]).addTo(map)
                            .bindPopup("<b>أنت هنا!</b><br>نبحث لك عن أقرب المراكز الطبية.")
                            .openPopup();
                    }

                    // مثال لإضافة مستشفى قريب (يمكنك تكرار هذا السطر لإضافة عياداتك)
                    L.marker([lat + 0.003, lng + 0.003]).addTo(map)
                        .bindPopup("<b>مستشفى الرعاية الطبية</b><br>يبعد حوالي 400 متر");
                },
                (error) => {
                    status.textContent = "تعذر الحصول على الموقع. يرجى تفعيل GPS والسماح للمتصفح بالوصول للموقع.";
                }
            );
        }
    </script>
</body>
</html>

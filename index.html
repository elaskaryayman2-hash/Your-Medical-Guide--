<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>دليلك الطبي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, Arial, sans-serif; }
        body, html { width: 100%; height: 100%; overflow: hidden; background-color: #f4f7f9; }
        
        /* حاوية التطبيق الرئيسية بصورة الخلفية */
        .app-container {
            position: relative;
            width: 100vw;
            height: 100vh;
            background-image: url('bg.png.jpg');
            background-size: 100% 100%;
            background-repeat: no-repeat;
        }

        /* شريط البلد والمسافة العلوي */
        .location-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background: rgba(21, 101, 192, 0.92);
            color: white;
            padding: 10px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            z-index: 10;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .distance-badge {
            background: rgba(255, 255, 255, 0.25);
            padding: 4px 10px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
        }

        /* منطقة البحث العلوية الشفافة */
        .search-area {
            position: absolute;
            top: 7%;
            left: 5%;
            width: 90%;
            height: 7%;
            cursor: pointer;
        }

        /* شبكة الأزرار الشفافة فوق الأيقونات الست */
        .grid-buttons {
            position: absolute;
            top: 16%;
            left: 4%;
            width: 92%;
            height: 72%;
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 1fr 1fr 1fr;
            gap: 10px;
        }

        .touch-btn {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            cursor: pointer;
        }
        .touch-btn:active {
            background-color: rgba(21, 101, 192, 0.15);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- شريط البلد والمسافة -->
    <div class="location-bar">
        <span id="countryText">📍 جاري تحديد البلد والمدينة...</span>
        <span class="distance-badge" id="distanceBtn" onclick="changeDistance()">النطاق: 5 كم</span>
    </div>

    <!-- زر البحث -->
    <div class="search-area" onclick="openNearby('خدمات طبية')"></div>

    <!-- الأزرار التفاعلية فوق أيقونات صورتك -->
    <div class="grid-buttons">
        <!-- صف 1 يمين: عيادات ومستشفيات -->
        <div class="touch-btn" onclick="openNearby('مستشفى وعيادة')"></div>
        <!-- صف 1 يسار: ابحث عن طبيب -->
        <div class="touch-btn" onclick="openNearby('طبيب')"></div>

        <!-- صف 2 يمين: صيدليات -->
        <div class="touch-btn" onclick="openNearby('صيدلية')"></div>
        <!-- صف 2 يسار: الطوارئ -->
        <div class="touch-btn" onclick="openNearby('طوارئ مستشفى')"></div>

        <!-- صف 3 يمين: إشعارات -->
        <div class="touch-btn" onclick="alert('لا توجد إشعارات طبية جديدة حالياً')"></div>
        <!-- صف 3 يسار: تاريخي الطبي -->
        <div class="touch-btn" onclick="alert('سجل التاريخ الطبي قيد التحديث')"></div>
    </div>
</div>

<script>
    let userLat = null;
    let userLng = null;
    let radiusKm = 5;

    // 1. تحديد الموقع والبلد تلقائياً عند فتح التطبيق
    window.onload = function() {
        if ("geolocation" in navigator) {
            navigator.geolocation.getCurrentPosition(
                function(position) {
                    userLat = position.coords.latitude;
                    userLng = position.coords.longitude;
                    getCountryName(userLat, userLng);
                },
                function(error) {
                    document.getElementById("countryText").innerText = "⚠️ يرجى تفعيل الـ GPS في الهاتف";
                },
                { enableHighAccuracy: true }
            );
        } else {
            document.getElementById("countryText").innerText = "الموقع غير مدعوم";
        }
    };

    // 2. جلب اسم البلد والمدينة من الإنترنت
    function getCountryName(lat, lng) {
        fetch(`https://openstreetmap.org{lat}&lon=${lng}&accept-language=ar`)
            .then(res => res.json())
            .then(data => {
                let country = data.address.country || "";
                let city = data.address.state || data.address.city || "";
                document.getElementById("countryText").innerText = `📍 ${country} - ${city}`;
            })
            .catch(() => {
                document.getElementById("countryText").innerText = `📍 متصل (${lat.toFixed(2)}, ${lng.toFixed(2)})`;
            });
    }

    // 3. تغيير نطاق المسافة عند الضغط عليها
    function changeDistance() {
        radiusKm = (radiusKm === 5) ? 10 : (radiusKm === 10 ? 20 : 5);
        document.getElementById("distanceBtn").innerText = `النطاق: ${radiusKm} كم`;
    }

    // 4. فتح أقرب خدمة طبية على خرائط جوجل عبر الإنترنت
    function openNearby(category) {
        if (userLat && userLng) {
            window.location.href = `https://google.com{encodeURIComponent(category)}/@${userLat},${userLng},14z`;
        } else {
            alert("جاري تحديد موقعك الجغرافي، تأكد من تشغيل الـ GPS والإنترنت.");
        }
    }
</script>

</body>
</html>

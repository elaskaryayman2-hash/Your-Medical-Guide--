name: Build Daleelak APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '22'
    - uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '21'
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
    - name: Create App and Build APK
      run: |
        mkdir -p www
        cat << 'EOF' > www/index.html
        <!DOCTYPE html>
        <html lang="ar" dir="rtl">
        <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
            <title>دليلك الطبي الذكي</title>
            <style>
                :root { --primary: #0275d8; --primary-dark: #025aa5; --success: #28a745; --danger: #dc3545; --bg: #f0f4f8; --card-bg: #ffffff; --text: #2c3e50; }
                * { box-sizing: border-box; font-family: Tahoma, Arial, sans-serif; }
                body { background-color: var(--bg); margin: 0; padding: 0; color: var(--text); padding-bottom: 30px; }
                .emergency-bar { background-color: var(--danger); color: white; padding: 8px 12px; display: flex; justify-content: space-around; align-items: center; font-size: 13px; font-weight: bold; }
                .emergency-bar a { color: white; text-decoration: none; background: rgba(0,0,0,0.2); padding: 4px 10px; border-radius: 15px; }
                .header { background: linear-gradient(135deg, var(--primary), var(--primary-dark)); color: white; padding: 20px 15px; text-align: center; border-bottom-left-radius: 20px; border-bottom-right-radius: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
                .header h1 { margin: 0; font-size: 22px; }
                .header p { margin: 5px 0 0; font-size: 13px; opacity: 0.9; }
                .container { padding: 15px; max-width: 600px; margin: auto; }
                .control-panel { background: var(--card-bg); padding: 15px; border-radius: 15px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 15px; }
                .input-group { margin-bottom: 10px; }
                input, select { width: 100%; padding: 12px; border: 1px solid #dce1e7; border-radius: 10px; font-size: 15px; outline: none; }
                .action-buttons { display: flex; gap: 8px; }
                .btn { flex: 1; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: bold; color: white; cursor: pointer; }
                .btn-gps { background-color: var(--success); }
                .btn-city { background-color: var(--primary); }
                .tabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 5px; margin-bottom: 12px; }
                .tab { background: #e2e8f0; color: #475569; border: none; padding: 8px 14px; border-radius: 20px; font-size: 13px; font-weight: bold; white-space: nowrap; cursor: pointer; }
                .tab.active { background: var(--primary); color: white; }
                #status { text-align: center; font-size: 14px; color: #555; margin: 10px 0; padding: 10px; background: #e9ecef; border-radius: 8px; }
                .card { background: var(--card-bg); border-radius: 14px; padding: 15px; margin-bottom: 12px; box-shadow: 0 3px 10px rgba(0,0,0,0.05); border-right: 5px solid var(--primary); position: relative; }
                .card h3 { margin: 0 0 6px 0; font-size: 17px; color: var(--primary-dark); padding-left: 30px; }
                .badge { display: inline-block; padding: 3px 8px; font-size: 11px; border-radius: 6px; background: #e3f2fd; color: var(--primary-dark); font-weight: bold; margin-bottom: 8px; }
                .distance-badge { background: #e8f5e9; color: #2e7d32; margin-right: 5px; }
                .fav-btn { position: absolute; top: 15px; left: 15px; background: none; border: none; font-size: 20px; cursor: pointer; color: #ccc; }
                .fav-btn.saved { color: #f39c12; }
                .card p { margin: 4px 0; font-size: 13px; color: #64748b; }
                .card-actions { display: flex; gap: 8px; margin-top: 12px; border-top: 1px solid #f1f5f9; padding-top: 10px; }
                .action-link { flex: 1; text-align: center; padding: 8px; border-radius: 8px; text-decoration: none; font-size: 13px; font-weight: bold; }
                .link-map { background: #e8f5e9; color: #2e7d32; }
                .link-call { background: #e3f2fd; color: #0275d8; }
                .link-disabled { background: #f1f5f9; color: #94a3b8; pointer-events: none; }
            </style>
        </head>
        <body>
        <div class="emergency-bar">
            <span>طوارئ مصر:</span>
            <a href="tel:123">🚑 إسعاف 123</a>
            <a href="tel:122">🚓 نجدة 122</a>
            <a href="tel:180">🚒 مطافئ 180</a>
        </div>
        <div class="header">
            <h1>دليلك الطبي الذكي</h1>
            <p>أقرب الأطباء، المستشفيات، والصيدليات بضغطة زر</p>
        </div>
        <div class="container">
            <div class="control-panel">
                <div class="input-group">
                    <input type="text" id="nameFilter" placeholder="🔍 ابحث بالاسم (دكتور، صيدلية، مستشفى)..." onkeyup="renderList()">
                </div>
                <div class="input-group" style="display: flex; gap: 6px;">
                    <input type="text" id="cityInput" placeholder="أو اكتب اسم المدينة (مثلاً: الأقصر، القاهرة)...">
                    <select id="radiusSelect" style="width: 110px;">
                        <option value="3000">3 كم</option>
                        <option value="5000" selected>5 كم</option>
                        <option value="10000">10 كم</option>
                        <option value="20000">20 كم</option>
                    </select>
                </div>
                <div class="action-buttons">
                    <button class="btn btn-gps" onclick="searchByGPS()">📍 الأقرب لموقعي (GPS)</button>
                    <button class="btn btn-city" onclick="searchByCity()">🏙️ بحث بالمدينة</button>
                </div>
            </div>
            <div class="tabs">
                <button class="tab active" onclick="setFilter('all', this)">الكل</button>
                <button class="tab" onclick="setFilter('hospital', this)">🏥 مستشفيات</button>
                <button class="tab" onclick="setFilter('clinic', this)">👨‍⚕️ أطباء وعيادات</button>
                <button class="tab" onclick="setFilter('pharmacy', this)">💊 صيدليات</button>
                <button class="tab" onclick="setFilter('favorites', this)">⭐ المفضلة</button>
            </div>
            <div id="status">اضغط على "الأقرب لموقعي" أو اكتب اسم مدينتك للبدء</div>
            <div id="resultsContainer"></div>
        </div>
        <script>
            let placesData = [];
            let userLat = null;
            let userLon = null;
            let activeTab = 'all';
            let favorites = JSON.parse(localStorage.getItem('med_favs') || '[]');
            function calculateDistance(lat1, lon1, lat2, lon2) {
                if (!lat1 || !lon1) return null;
                const R = 6371;
                const dLat = (lat2 - lat1) * Math.PI / 180;
                const dLon = (lon2 - lon1) * Math.PI / 180;
                const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                return (R * c).toFixed(1);
            }
            function searchByGPS() {
                const status = document.getElementById('status');
                status.innerText = "⏳ جاري تحديد موقعك الجغرافي بدقة...";
                if (!navigator.geolocation) { status.innerText = "❌ جهازك لا يدعم خاصية تحديد الموقع."; return; }
                navigator.geolocation.getCurrentPosition(
                    (pos) => { userLat = pos.coords.latitude; userLon = pos.coords.longitude; status.innerText = "✅ تم تحديد موقعك! جاري جلب الأطباء والصيدليات القريبة..."; fetchMedicalData(userLat, userLon); },
                    (err) => { status.innerText = "⚠️ تعذر الوصول للموقع. تأكد من تفعيل GPS في الهاتف ومنح الصلاحية للتطبيق."; },
                    { enableHighAccuracy: true, timeout: 12000 }
                );
            }
            async function searchByCity() {
                const city = document.getElementById('cityInput').value.trim();
                const status = document.getElementById('status');
                if (!city) { status.innerText = "⚠️ يرجى كتابة اسم المدينة أو المنطقة أولاً."; return; }
                status.innerText = `⏳ جاري البحث عن إحداثيات "${city}"...`;
                try {
                    const geoRes = await fetch(`https://openstreetmap.org{encodeURIComponent(city)}&limit=1`);
                    const geoData = await geoRes.json();
                    if (geoData.length === 0) { status.innerText = "❌ لم يتم العثور على هذه المدينة، حاول كتابة اسم أشهر."; return; }
                    userLat = parseFloat(geoData.lat);
                    userLon = parseFloat(geoData.lon);
                    status.innerText = `✅ جاري جلب الخدمات الطبية في "${city}"...`;
                    fetchMedicalData(userLat, userLon);
                } catch (e) { status.innerText = "❌ خطأ في الاتصال بالإنترنت."; }
            }

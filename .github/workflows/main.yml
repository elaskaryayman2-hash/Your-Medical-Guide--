name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Capacitor and Sync Android
        run: |
          mkdir -p www
          cp index.html www/
          cat << 'EOF' > capacitor.config.json
          {
            "appId": "com.daleelak.medical",
            "appName": "دليلك الطبي",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF
          npm install
          npx cap add android
          npx cap sync android

      - name: Configure App Name & Permissions
        run: |
          python3 -c '
          # 1. إضافة صلاحيات الموقع الجغرافي والإنترنت
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()
          perms = """    <uses-permission android:name="android.permission.INTERNET" />
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-feature android:name="android.hardware.location.gps" android:required="false" />
          """
          content = content.replace("<application", perms + "<application", 1)
          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)

          # 2. تأكيد ظهور اسم "دليلك الطبي" على أيقونة الشاشة
          strings_path = "android/app/src/main/res/values/strings.xml"
          strings_content = """<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <string name="app_name">دليلك الطبي</string>
              <string name="title_activity_main">دليلك الطبي</string>
              <string name="package_name">com.daleelak.medical</string>
              <string name="custom_url_scheme">com.daleelak.medical</string>
          </resources>
          """
          with open(strings_path, "w", encoding="utf-8") as f:
              f.write(strings_content)
          '

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk


name: Build Dalilak Medical APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Prepare Web Assets
        run: |
          mkdir -p www
          cp index.html www/
          cp bg.png.jpg www/ || true
          cp app_icon.png.jpg www/ || true

      - name: Install Capacitor & Build Android Project
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "دليلك الطبي" "com.dalilak.medical" --web-dir="www"
          npx cap add android
          npx cap sync android

      - name: Set App Icon & Location Permissions
        run: |
          if [ -f "app_icon.png.jpg" ]; then
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-*; do
              cp app_icon.png.jpg "$dir/ic_launcher.png"
              cp app_icon.png.jpg "$dir/ic_launcher_round.png"
            done
          fi

          MANIFEST="android/app/src/main/AndroidManifest.xml"
          sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET" \/>\n    <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" \/>\n    <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" \/>\n    <application/' $MANIFEST

      - name: Build Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dalilak-Medical-App
          path: android/app/build/outputs/apk/debug/app-debug.apk

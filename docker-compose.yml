services:
  db:
    image: postgis/postgis:16-3.4
    container_name: medical-guide-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: medicalguide
      POSTGRES_USER: medicalguide
      POSTGRES_PASSWORD: ${DB_PASSWORD:-change-this-password}
    ports:
      - "5432:5432"
    volumes:
      - medical_guide_db:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - ./database/migrations/002_provider_onboarding.sql:/docker-entrypoint-initdb.d/002-onboarding.sql:ro
      - ./database/migrations/003_provider_submissions.sql:/docker-entrypoint-initdb.d/003-submissions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medicalguide -d medicalguide"]
      interval: 5s
      timeout: 5s
      retries: 20
  api:
    build: ./backend
    container_name: medical-guide-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://medicalguide:${DB_PASSWORD:-change-this-password}@db:5432/medicalguide
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  medical_guide_db:
